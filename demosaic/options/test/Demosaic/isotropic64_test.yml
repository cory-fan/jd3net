# general settings
name: Isotropic64_Test
model_type: ImageRestorationModel
scale: 1
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 10

# dataset and data loader settings
datasets:

  test:
    name: gopro-test
    type: McMasterDataset

    dataroot_gt: ./datasets/GoPro/test/target.lmdb #this doesn't do anything
    dataroot_lq: ./datasets/GoPro/test/input.lmdb #this doesn't do anything

    io_backend:
      type: folder

# network structures
network_g:
  type: IsotropicNet
  width: 128
  downsample: 4
  img_channel: 3
  depth: 152
  start_kernel_size: 3

# path
path:
  pretrain_network_g: /home/featurize/work/ovt/NAFNet/experiments/IsotropicNet-64-Bayer_archived_20251116_155914/models/net_g_1000000.pth
  strict_load_g: true
  resume_state: ~

# validation settings
val:
  save_img: true
  grids: false


  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# dist training settings
dist_params:
  backend: nccl
  port: 29500
