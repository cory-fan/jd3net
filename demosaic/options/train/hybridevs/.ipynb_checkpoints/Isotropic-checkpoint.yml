# general settings
name: IsotropicNet-HybridEVS
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: mipi
    type: MIPIDataset

    filename_tmpl: '{}'
    io_backend:
      type: lmdb

    gt_size: 128
    use_flip: true
    use_rot: true
    crop: 3
    concat_filter: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 20
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    concat_filter: false

  val:
    name: div2k
    type: CustomValDataset
    # dataroot_gt: /home/featurize/data/folderdata/val/gt/
    # dataroot_lq: /home/featurize/data/folderdata/val/lq/
    io_backend:
      type: lmdb

    bayer: 4


network_g:
  type: IsotropicHybridEVSNet
  width: 128
  downsample: 4
  img_channel: 3
  depth: 152
  start_kernel_size: 3

# path
path:
  pretrain_network_g: ~
  strict_load_g: False
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 0
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 800000
    eta_min: !!float 1e-7

  total_iter: 800000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: true


  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 250
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
